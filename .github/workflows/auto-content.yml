name: Auto Content Generation

on:
  workflow_dispatch:
    inputs:
      force:
        description: '강제 실행 (기존 파일 덮어쓰기 없음)'
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 자동 콘텐츠 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAILY_AI_BUDGET: '0.5'
          BATCH_POSTS: '7'
        run: node scripts/auto-content.js

      - name: 변경사항 확인
        id: check_changes
        run: |
          if git diff --quiet && git ls-files --others --exclude-standard | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif ! git diff --quiet; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: 검토용 패치 검증
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git diff --check
          npm ci
          npm run type-check
          git add -N src/app/blog/ src/data/blog-posts.js
          git diff --binary > generated-content.patch

      - name: 검토용 패치 업로드
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-content-review
          path: generated-content.patch
          if-no-files-found: error
