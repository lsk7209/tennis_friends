name: Content Refresh

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 6개월+ 콘텐츠 리프레시
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/content-refresh.js

      - name: 변경사항 확인
        id: check_changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 검토용 패치 검증
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git diff --check
          npm ci
          npm run type-check
          git add -N src/app/blog/ src/data/blog-posts.js
          git diff --binary > refreshed-content.patch

      - name: 검토용 패치 업로드
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-content-review
          path: refreshed-content.patch
          if-no-files-found: error
