name: Editorial operations monitor

on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Publication queue and public sitemap URLs
        shell: bash
        run: |
          node --experimental-strip-types --test scripts/audit-editorial-operations.test.mjs
          node --experimental-strip-types scripts/audit-editorial-operations.mjs --check-urls --check-release | tee editorial-report.json
      - name: Preserve monitor result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editorial-report
          path: editorial-report.json
          retention-days: 7
          if-no-files-found: warn
